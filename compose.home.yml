# Private deployment: Tailscale Serve provides HTTPS on the host.
# docker compose --env-file .env.home -f compose.home.yml up -d --build --wait
name: memedrop

services:
  memedrop-api:
    extends:
      file: docker-compose.yml
      service: memedrop-api
    environment:
      MEMEDROP_API_KEY: ${MEMEDROP_API_KEY:?Set MEMEDROP_API_KEY in .env.home}
      MEMEDROP_COBALT_PUBLIC_URL: http://cobalt:9000/
      MEMEDROP_COBALT_TIMEOUT: "60"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cobalt:
    extends:
      file: docker-compose.yml
      service: cobalt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
